schema_version = 1
edge_kinds = ["normal", "build"]

[[profiles]]
id = "full-dist"
package = "zeroclaw"
mode = "selection"
selection = "dist"

[[profiles]]
id = "no-saas-coding"
package = "zeroclaw"
mode = "features"
features = [
    "acp-bridge", "agent-runtime", "channel-acp-server", "channel-discord",
    "channel-email", "channel-filesystem", "channel-git", "channel-lark",
    "channel-matrix", "channel-telegram", "channel-webhook", "gateway",
    "observability-prometheus", "plugins-wasm-cranelift", "schema-export",
    "tools-external", "whatsapp-web",
]

[[profiles]]
id = "no-native-adapters"
package = "zeroclaw"
mode = "features"
features = [
    "acp-bridge", "agent-runtime", "channel-acp-server", "channel-discord",
    "channel-email", "channel-filesystem", "channel-git", "channel-lark",
    "channel-matrix", "channel-telegram", "channel-webhook", "gateway",
    "observability-prometheus", "plugins-wasm-cranelift", "schema-export",
    "whatsapp-web",
]

[[contracts]]
id = "full-plugin-host-preserved"
profile = "full-dist"
kind = "feature"
package = "zeroclaw"
feature = "plugins-wasm-cranelift"
expect = "enabled"

[[contracts]]
id = "no-saas-plugin-host-preserved"
profile = "no-saas-coding"
kind = "feature"
package = "zeroclaw"
feature = "plugins-wasm-cranelift"
expect = "enabled"

[[contracts]]
id = "no-adapters-plugin-host-preserved"
profile = "no-native-adapters"
kind = "feature"
package = "zeroclaw"
feature = "plugins-wasm-cranelift"
expect = "enabled"

[[contracts]]
id = "external-tools-preserved"
profile = "no-saas-coding"
kind = "feature"
package = "zeroclaw-tools"
feature = "tools-external"
expect = "enabled"

[[contracts]]
id = "external-tools-omitted"
profile = "no-native-adapters"
kind = "feature"
package = "zeroclaw-tools"
feature = "tools-external"
expect = "forbidden"
