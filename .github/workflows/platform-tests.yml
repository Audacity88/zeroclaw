name: Windows issue 10793 diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-10793-diagnostics-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  windows-diagnostics:
    name: Exact Windows diagnostics
    if: github.repository == 'Audacity88/zeroclaw'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: platform-test
          save-if: false
      - name: Record basis and prepare placeholder
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          rustc -Vv
          mkdir -p web/dist
          touch web/dist/.gitkeep
      - name: Record Windows PowerShell version
        shell: powershell
        run: $PSVersionTable.PSVersion.ToString()
      - name: Build only the runtime library test harness
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p zeroclaw-runtime --lib --no-run --message-format=json > "$RUNNER_TEMP/windows-10793-build.jsonl"
      - name: Execute only the exact environment add-back diagnostic
        timeout-minutes: 15
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time

          messages = [json.loads(line) for line in (Path(os.environ['RUNNER_TEMP']) / 'windows-10793-build.jsonl').read_text().splitlines()]
          harnesses = {message['executable'] for message in messages
                       if message.get('reason') == 'compiler-artifact'
                       and message.get('target', {}).get('name') == 'zeroclaw_runtime'
                       and message.get('profile', {}).get('test')
                       and message.get('executable')}
          if len(harnesses) != 1:
              sys.exit('Expected exactly one runtime library test harness')
          harness = harnesses.pop()
          tests = [
              ('tools::shell::tests::windows_powershell_pipeline_environment_diagnostic', True),
          ]
          failed = False
          for name, ignored in tests:
              command = [harness, name, '--exact', '--nocapture']
              if ignored:
                  command.append('--ignored')
              print(f'EXACT_TEST {name}', flush=True)
              started = time.monotonic()
              try:
                  result = subprocess.run(command, capture_output=True, text=True,
                                          encoding='utf-8', errors='replace', timeout=690)
              except subprocess.TimeoutExpired as error:
                  # subprocess.run kills and waits for the harness on timeout.
                  # Stop this job rather than continue with uncertain descendants.
                  print(error.stdout or b'', flush=True)
                  print(error.stderr or b'', flush=True)
                  sys.exit('Harness timeout: stop; runner teardown owns remaining descendants')
              print(result.stdout, flush=True)
              print(result.stderr, flush=True)
              exactly_one = re.search(r'^running 1 test\r?$', result.stdout, re.MULTILINE) is not None
              print(f'EXACT_RESULT name={name} exit={result.returncode} exactly_one={exactly_one} elapsed_s={time.monotonic() - started:.3f}', flush=True)
              failed |= result.returncode != 0 or not exactly_one
          sys.exit(1 if failed else 0)
