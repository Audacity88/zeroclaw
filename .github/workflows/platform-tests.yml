name: Windows service fixture debug-info comparison

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  seed-no-debug:
    name: Seed no-debug development dependencies
    if: github.repository == 'Audacity88/zeroclaw' && github.ref == 'refs/heads/codex/windows-service-smoke-warm-canary'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Audacity88/zeroclaw
          ref: c77622c7f532a3a62fd1cd12df728760b348dc34
          persist-credentials: false
      - name: Verify source revision and profile override
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = c77622c7f532a3a62fd1cd12df728760b348dc34
          test "$CARGO_PROFILE_DEV_DEBUG" = 0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        id: cache
        with:
          shared-key: service-fixture-no-debug-${{ github.run_id }}-${{ github.run_attempt }}
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: true
      - name: Require isolated cold cache
        if: steps.cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          echo '::error::Unexpected existing cache in the isolated seed job'
          exit 1
      - name: Build the fixture to seed no-debug dependencies
        shell: bash
        run: >-
          cargo build --profile dev --locked -p zeroclaw-runtime
          --example windows_service_smoke_fixture
          --target x86_64-pc-windows-msvc

  measure-debug:
    name: Measure warm development build with debug info
    needs: seed-no-debug
    if: github.repository == 'Audacity88/zeroclaw' && github.ref == 'refs/heads/codex/windows-service-smoke-warm-canary'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Audacity88/zeroclaw
          ref: c77622c7f532a3a62fd1cd12df728760b348dc34
          persist-credentials: false
      - name: Verify source revision and unchanged debug default
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = c77622c7f532a3a62fd1cd12df728760b348dc34
          test -z "${CARGO_PROFILE_DEV_DEBUG+x}"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        id: cache
        with:
          shared-key: service-fixture-canary-37088463604-1
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: false
      - name: Require a full dependency-cache hit without a built fixture
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test ! -e target/x86_64-pc-windows-msvc/debug/examples/windows_service_smoke_fixture.exe
      - name: Record measurement environment
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/windows-service-smoke-evidence"
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            printf 'ImageOS=%s\nImageVersion=%s\nRUNNER_NAME=%s\nCARGO_PROFILE_DEV_DEBUG=default\nCARGO_INCREMENTAL=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$RUNNER_NAME" "$CARGO_INCREMENTAL"
          } | tee "$RUNNER_TEMP/windows-service-smoke-evidence/build-environment.txt"
      - name: Measure the warm fixture build
        shell: bash
        run: |
          set -euo pipefail
          cargo_log="$RUNNER_TEMP/windows-service-smoke-evidence/fixture-build.log"
          SECONDS=0
          cargo build --profile dev --locked -p zeroclaw-runtime --example windows_service_smoke_fixture --target x86_64-pc-windows-msvc --timings 2>&1 | tee "$cargo_log"
          printf 'Build wall time: %s seconds\n' "$SECONDS" | tee "$RUNNER_TEMP/windows-service-smoke-evidence/build-wall-time.txt"
          cp -R target/cargo-timings "$RUNNER_TEMP/windows-service-smoke-evidence/cargo-timings"
      - name: Record generated binary and symbol sizes
        shell: pwsh
        run: |
          $target = 'target/x86_64-pc-windows-msvc/debug'
          $fixture = Get-Item "$target/examples/windows_service_smoke_fixture.exe" -ErrorAction Stop
          $symbols = @(Get-ChildItem $target -Recurse -File -Filter '*.pdb' -ErrorAction Stop)
          [ordered]@{
            source = (git rev-parse HEAD)
            debugSetting = 'default'
            fixtureBytes = $fixture.Length
            pdbCount = $symbols.Count
            pdbBytes = [long](($symbols | Measure-Object -Property Length -Sum).Sum)
          } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/windows-service-smoke-evidence/build-sizes.json"
      - name: Exercise installed Windows service lifecycle
        shell: pwsh
        timeout-minutes: 15
        run: |
          ./scripts/ci/windows_service_smoke.ps1 `
            -FixturePath "target/x86_64-pc-windows-msvc/debug/examples/windows_service_smoke_fixture.exe" `
            -ConfigDir "$env:USERPROFILE/zeroclaw service smoke 界" `
            -EvidenceDir "$env:RUNNER_TEMP/windows-service-smoke-evidence"
      - name: Clean up Windows service smoke
        if: always()
        shell: pwsh
        timeout-minutes: 3
        run: |
          ./scripts/ci/windows_service_smoke.ps1 `
            -FixturePath "target/x86_64-pc-windows-msvc/debug/examples/windows_service_smoke_fixture.exe" `
            -ConfigDir "$env:USERPROFILE/zeroclaw service smoke 界" `
            -EvidenceDir "$env:RUNNER_TEMP/windows-service-smoke-evidence" `
            -CleanupOnly
      - name: Upload Windows service smoke and build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-service-smoke-debug-evidence
          path: ${{ runner.temp }}/windows-service-smoke-evidence
          if-no-files-found: warn
          retention-days: 7

  measure-no-debug:
    name: Measure warm development build without debug info
    needs: seed-no-debug
    if: github.repository == 'Audacity88/zeroclaw' && github.ref == 'refs/heads/codex/windows-service-smoke-warm-canary'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Audacity88/zeroclaw
          ref: c77622c7f532a3a62fd1cd12df728760b348dc34
          persist-credentials: false
      - name: Verify source revision and profile override
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = c77622c7f532a3a62fd1cd12df728760b348dc34
          test "$CARGO_PROFILE_DEV_DEBUG" = 0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        id: cache
        with:
          shared-key: service-fixture-no-debug-${{ github.run_id }}-${{ github.run_attempt }}
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: false
      - name: Require a full dependency-cache hit without a built fixture
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test ! -e target/x86_64-pc-windows-msvc/debug/examples/windows_service_smoke_fixture.exe
      - name: Record measurement environment
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/windows-service-smoke-evidence"
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            printf 'ImageOS=%s\nImageVersion=%s\nRUNNER_NAME=%s\nCARGO_PROFILE_DEV_DEBUG=%s\nCARGO_INCREMENTAL=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$RUNNER_NAME" "$CARGO_PROFILE_DEV_DEBUG" "$CARGO_INCREMENTAL"
          } | tee "$RUNNER_TEMP/windows-service-smoke-evidence/build-environment.txt"
      - name: Measure the warm fixture build
        shell: bash
        run: |
          set -euo pipefail
          cargo_log="$RUNNER_TEMP/windows-service-smoke-evidence/fixture-build.log"
          SECONDS=0
          cargo build --profile dev --locked -p zeroclaw-runtime --example windows_service_smoke_fixture --target x86_64-pc-windows-msvc --timings 2>&1 | tee "$cargo_log"
          printf 'Build wall time: %s seconds\n' "$SECONDS" | tee "$RUNNER_TEMP/windows-service-smoke-evidence/build-wall-time.txt"
          cp -R target/cargo-timings "$RUNNER_TEMP/windows-service-smoke-evidence/cargo-timings"
      - name: Record generated binary and symbol sizes
        shell: pwsh
        run: |
          $target = 'target/x86_64-pc-windows-msvc/debug'
          $fixture = Get-Item "$target/examples/windows_service_smoke_fixture.exe" -ErrorAction Stop
          $symbols = @(Get-ChildItem $target -Recurse -File -Filter '*.pdb' -ErrorAction Stop)
          [ordered]@{
            source = (git rev-parse HEAD)
            debugSetting = '0'
            fixtureBytes = $fixture.Length
            pdbCount = $symbols.Count
            pdbBytes = [long](($symbols | Measure-Object -Property Length -Sum).Sum)
          } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/windows-service-smoke-evidence/build-sizes.json"
      - name: Exercise installed Windows service lifecycle
        shell: pwsh
        timeout-minutes: 15
        run: |
          ./scripts/ci/windows_service_smoke.ps1 `
            -FixturePath "target/x86_64-pc-windows-msvc/debug/examples/windows_service_smoke_fixture.exe" `
            -ConfigDir "$env:USERPROFILE/zeroclaw service smoke 界" `
            -EvidenceDir "$env:RUNNER_TEMP/windows-service-smoke-evidence"
      - name: Clean up Windows service smoke
        if: always()
        shell: pwsh
        timeout-minutes: 3
        run: |
          ./scripts/ci/windows_service_smoke.ps1 `
            -FixturePath "target/x86_64-pc-windows-msvc/debug/examples/windows_service_smoke_fixture.exe" `
            -ConfigDir "$env:USERPROFILE/zeroclaw service smoke 界" `
            -EvidenceDir "$env:RUNNER_TEMP/windows-service-smoke-evidence" `
            -CleanupOnly
      - name: Upload Windows service smoke and build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-service-smoke-no-debug-evidence
          path: ${{ runner.temp }}/windows-service-smoke-evidence
          if-no-files-found: warn
          retention-days: 7
