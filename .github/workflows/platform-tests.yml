name: Windows issue 10793 module analysis cache comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-10793-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-diagnostics:
    name: PowerShell module analysis cache comparison
    if: github.repository == 'Audacity88/zeroclaw'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Compare one cache override without a Rust rebuild
        shell: python
        timeout-minutes: 10
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile
          import threading
          import time

          # Freeze the source contract instead of inventing a second allowlist.
          expected = {
              'crates/zeroclaw-config/src/platform/native.rs': '7420ad6db1dddd3174ec412ae1a5edab7a975fdce0bbd19afe8b1f9415b34cd0',
              'crates/zeroclaw-runtime/src/tools/shell_env.rs': '2dbf7c674dfde322b36d0743d83b378aa4eabb7609981e65b1d973b154e66e1e',
          }
          for path, digest in expected.items():
              # Checkout may use CRLF; these source files are text contracts.
              content = Path(path).read_bytes().replace(b'\r\n', b'\n')
              if hashlib.sha256(content).hexdigest() != digest:
                  sys.exit('STOP: source contract drift')
          source = Path('crates/zeroclaw-runtime/src/tools/shell_env.rs').read_text()
          blocks = re.findall(r'#\[cfg\(target_os = "windows"\)\]\s*pub\(crate\) const SAFE_SHELL_ENV_VARS: &\[&str\] = &\[(.*?)\];', source, re.S)
          if len(blocks) != 1:
              sys.exit('STOP: cannot resolve Windows baseline')
          names = re.findall(r'"([A-Za-z_][A-Za-z_0-9]*)"', blocks[0])
          if re.sub(r'"[A-Za-z_][A-Za-z_0-9]*"|[\s,]', '', blocks[0]) or not names:
              sys.exit('STOP: unexpected baseline syntax')
          sanitized = {name: os.environ[name] for name in names if name in os.environ}
          print(json.dumps({'head': os.environ['GITHUB_SHA'], 'source_contract': 'matched', 'baseline_names': len(names)}), flush=True)

          plain = 'Write-Output "quoted safe value" | Select-Object -First 1'
          candidate = 'PSModuleAnalysisCachePath'
          value = os.environ.get(candidate)
          try:
              cache_ready = bool(value) and Path(value).is_absolute() and Path(value).is_file()
          except (OSError, ValueError):
              cache_ready = False
          candidate_absent = candidate.casefold() not in {name.casefold() for name in names}
          print(json.dumps({'cache_override_present': bool(value), 'cache_file_ready': cache_ready,
                            'candidate_absent_from_baseline': candidate_absent}), flush=True)
          if os.name != 'nt' or not cache_ready or not candidate_absent:
              sys.exit('STOP: cache comparison precondition failed')
          with_cache = dict(sanitized)
          with_cache[candidate] = value

          def drain(pipe, started):
              result = {'data': bytearray(), 'first_ms': None, 'eof_ms': None, 'overflow': False, 'error': False}
              def run():
                  try:
                      while True:
                          chunk = pipe.read1(4096)
                          now = round((time.monotonic() - started) * 1000, 3)
                          if not chunk:
                              result['eof_ms'] = now
                              break
                          if result['first_ms'] is None:
                              result['first_ms'] = now
                          if len(result['data']) + len(chunk) > 8192:
                              result['overflow'] = True
                              continue
                          result['data'].extend(chunk)
                  except Exception:
                      result['error'] = True
                  finally:
                      pipe.close()
              thread = threading.Thread(target=run, daemon=True)
              thread.start()
              return result, thread

          modes = [('inherited', None), ('sanitized', sanitized), ('sanitized-cache', with_cache)]
          with tempfile.TemporaryDirectory(prefix='zc10793-cache-') as cwd:
              for number, (mode, environment) in enumerate(modes + list(reversed(modes))):
                  print(f'CACHE_ATTEMPT round={number} mode={mode}', flush=True)
                  started = time.monotonic()
                  try:
                      child = subprocess.Popen(['powershell', '-NoProfile', '-NonInteractive', '-Command', plain],
                                               cwd=cwd, env=environment,
                                               stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                               creationflags=subprocess.CREATE_NO_WINDOW)
                  except Exception:
                      sys.exit('STOP: could not spawn fixed diagnostic')
                  out, out_thread = drain(child.stdout, started)
                  err, err_thread = drain(child.stderr, started)
                  timed_out = False
                  try:
                      code = child.wait(timeout=60)
                  except subprocess.TimeoutExpired:
                      timed_out = True
                      child.kill()
                      try:
                          code = child.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          sys.exit('STOP: child cleanup failed; runner teardown owns descendants')
                  exited_ms = round((time.monotonic() - started) * 1000, 3)
                  deadline = time.monotonic() + 5
                  for thread in (out_thread, err_thread):
                      thread.join(max(0, deadline - time.monotonic()))
                  if out_thread.is_alive() or err_thread.is_alive():
                      sys.exit('STOP: pipe cleanup failed; runner teardown owns descendants')
                  expected_output = ['quoted safe value']
                  try:
                      output_matches = bytes(out['data']).decode('ascii').splitlines() == expected_output
                  except UnicodeError:
                      output_matches = False
                  ok = code == 0 and not timed_out and output_matches and not err['data'] and not any(r['error'] or r['overflow'] for r in (out, err))
                  print(json.dumps({'round': number, 'mode': mode, 'exit': code, 'timed_out': timed_out, 'success': ok,
                                    'child_exit_ms': exited_ms, 'stdout_first_ms': out['first_ms'], 'stdout_eof_ms': out['eof_ms'],
                                    'stderr_eof_ms': err['eof_ms'],
                                    'stdout_bytes': len(out['data']), 'stderr_bytes': len(err['data']), 'output_matches': output_matches}), flush=True)
                  if not ok:
                      sys.exit('STOP: invalid cache observation; no retries')
          print('CACHE_RESULT attempts=6 success=True', flush=True)
