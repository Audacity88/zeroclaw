name: Windows PowerShell cache repair validation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact approved production repair commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-cache-repair-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  windows-focused:
    name: Windows exact shell regressions
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify source and inherited cache precondition
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          printf '%s  %s\n' 903e522cb7b86a1fb58cd1f2507efe82494bf24c6bd609f2a16558114f4e7965 crates/zeroclaw-runtime/src/tools/shell_env.rs | sha256sum --check
          python - <<'PY'
          import os
          value = os.environ.get("PSModuleAnalysisCachePath")
          assert value and os.path.isabs(value) and os.path.isfile(value), "runner cache precondition unavailable"
          print("Inherited analysis-cache override: present, absolute, existing file; value not logged")
          print("Runner image:", os.environ.get("ImageOS"), os.environ.get("ImageVersion"))
          PY
          git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: platform-test
          save-if: false
      - name: Prepare existing build prerequisite
        shell: bash
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: Build only runtime library test harness
        timeout-minutes: 50
        shell: bash
        run: cargo test --locked -p zeroclaw-runtime --lib --no-run
      - name: Run exactly three tests separately and verify nonzero counts
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          tests=(
            tools::shell_env::tests::safe_shell_env_vars_preserve_powershell_module_discovery
            tools::shell::tests::powershell_agent_shell_executes_safe_pipeline_and_rejects_dangerous_alias
            tools::skill_tool::tests::skill_shell_tool_executes_powershell_safe_pipeline_with_sanitized_env
          )
          for test_name in "${tests[@]}"; do
            log_file="$RUNNER_TEMP/${test_name//::/_}.log"
            cargo test --locked -p zeroclaw-runtime --lib "$test_name" -- --exact 2>&1 | tee "$log_file"
            grep -F "test $test_name ... ok" "$log_file"
            grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;' "$log_file" | tee -a "$GITHUB_STEP_SUMMARY"
            printf 'Validated: %s\n' "$test_name" >> "$GITHUB_STEP_SUMMARY"
          done
