name: PR 9430 Containerfile Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  containerfile:
    name: Containerfile amd64 build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build Containerfile for linux/amd64 without pushing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Containerfile
          target: web-build
          push: false
          load: false
          platforms: linux/amd64
          tags: zeroclaw-pr-9430-validation:build
          cache-from: type=gha,scope=containerfile-pr-9430-amd64
          cache-to: type=gha,scope=containerfile-pr-9430-amd64,mode=max
