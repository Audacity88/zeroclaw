name: SBOM action smoke

on:
  pull_request:
    paths:
      - ".github/workflows/sbom-action-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: smoke.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: smoke.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Validate SBOM envelopes
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            (.spdxVersion | startswith("SPDX-")) and
            (.packages | type == "array") and
            (.packages | length > 0)
          ' smoke.spdx.json

          jq -e '
            .bomFormat == "CycloneDX" and
            (.components | type == "array") and
            (.components | length > 0)
          ' smoke.cdx.json
