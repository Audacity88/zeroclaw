name: Culling adapter footprint experiment

on:
  push:
    branches: [codex/culling-footprint-20261008]

permissions:
  contents: read

concurrency:
  group: culling-footprint-20261008
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: 1.98.0
  SOURCE_SHA: cb58607b8ea29c725d31bd44d629d80ec0bce41e
  REPORTER_SHA: 40cb7be43e7db9b40cd5f720ee34d2ae964de415

jobs:
  measure:
    if: github.repository == 'Audacity88/zeroclaw' && github.actor == 'Audacity88'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out experiment
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: harness
          persist-credentials: false
      - name: Check out immutable measured source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: zeroclaw-labs/zeroclaw
          ref: cb58607b8ea29c725d31bd44d629d80ec0bce41e
          path: source
          persist-credentials: false
      - name: Check out immutable reporter
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: zeroclaw-labs/zeroclaw
          ref: 40cb7be43e7db9b40cd5f720ee34d2ae964de415
          path: reporter
          persist-credentials: false
      - name: Install fixed toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.98.0
          targets: x86_64-unknown-linux-gnu
      - name: Capture closures and measure three release binaries
        run: |
          chmod +x harness/experiment.py
          for profile in full-dist no-saas-coding no-native-adapters; do
            python3 harness/experiment.py measure "$profile"
          done
      - name: Validate controls and summarize capability costs
        run: python3 harness/experiment.py summarize
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: footprint-all
          path: harness/results/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
