name: PR Size Labeler

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pr-size-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    name: Apply PR size label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch trusted base classifier
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/github/pr_size_label.py?ref=$BASE_SHA" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/pr_size_label.py"

      - name: Apply size label from PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 "$RUNNER_TEMP/pr_size_label.py"
