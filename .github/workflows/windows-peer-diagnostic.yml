name: PR 10621 Windows peer diagnostic

on:
  push:
    branches: [codex/pr-10621-windows-peer-diagnostic]
    paths: [.github/workflows/windows-peer-diagnostic.yml]

permissions:
  contents: read

concurrency:
  group: pr-10621-windows-peer-diagnostic
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  peer-diagnostic:
    if: github.repository == 'Audacity88/zeroclaw'
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Audacity88/zeroclaw
          ref: de4d313eec9a57b01b438f486b204aad20c2e869
          persist-credentials: false
      - name: Check diagnostic prerequisites before compiling
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne 'de4d313eec9a57b01b438f486b204aad20c2e869') {
            throw 'Unexpected source revision'
          }
          if (git status --porcelain) { throw 'Unexpected source modifications' }
          foreach ($key in @('RUST_MIN_STACK', 'RUSTFLAGS', 'CARGO_ENCODED_RUSTFLAGS', 'CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS')) {
            if (Test-Path "Env:$key") { throw "Unexpected override: $key" }
          }
          if (Get-ChildItem Env: | Where-Object Name -Like 'CARGO_PROFILE_*') {
            throw 'Unexpected Cargo profile override'
          }
          $cdb = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Debuggers/x64/cdb.exe'
          if (!(Test-Path $cdb)) { throw 'CDB unavailable; stop without compiling or installing tools' }
          "PEER_SOURCE=$(git rev-parse HEAD)"
          "RUNNER_IMAGE=$env:ImageOS $env:ImageVersion"
          "CDB_VERSION=$((Get-Item $cdb).VersionInfo.FileVersion)"
          "PEER_CDB=$($cdb.Replace('\', '/'))" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.1
      - name: Match original toolchain and fixture target
        run: |
          rustc -Vv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add wasm32-wasip2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: platform-test
          save-if: 'false'
      - name: Prepare the original web placeholder and pinned nextest
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force web/dist | Out-Null
          New-Item -ItemType File -Force web/dist/.gitkeep | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'cargo-nextest.tar.gz'
          Invoke-WebRequest 'https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.143/cargo-nextest-0.9.143-x86_64-pc-windows-msvc.tar.gz' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c42a1dbde532da06dc9b4a43d44fd0ce668b836c2ab7388410f10ff9834476a2') {
            throw 'nextest checksum mismatch'
          }
          tar zxf $archive -C "$HOME/.cargo/bin"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile with the original workspace feature selection
        timeout-minutes: 60
        run: |
          cargo nextest run --locked --no-run --workspace --exclude zeroclaw-desktop -E 'package(=zeroclaw-runtime) & test(=tools::send_message_to_peer::tests::peer_turn_cost_scope_through_execute_boundary_attributes_recipient_and_shares_budget)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture one peer test under CDB
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $commands = Join-Path $env:RUNNER_TEMP 'peer-cdb.txt'
          @'
          sxe -c ".echo PEER_STACK_OVERFLOW; .exr -1; .ecxr; kv 80; ~*k 40; q" sov
          g
          '@ | Set-Content -Encoding ascii $commands
          $commands = $commands.Replace('\', '/')
          $debugger = '"' + $env:PEER_CDB + '" -G -lines -cf "' + $commands + '"'
          $log = Join-Path $env:RUNNER_TEMP 'peer-cdb.log'
          cargo nextest run --locked --workspace --exclude zeroclaw-desktop -E 'package(=zeroclaw-runtime) & test(=tools::send_message_to_peer::tests::peer_turn_cost_scope_through_execute_boundary_attributes_recipient_and_shares_budget)' --debugger $debugger 2>&1 | Tee-Object -FilePath $log
          $result = $LASTEXITCODE
          "NEXTEST_DEBUGGER_EXIT=$result"
          "CDB_LOG_SHA256=$((Get-FileHash $log -Algorithm SHA256).Hash)"
          if (Select-String -Path $log -Pattern '^\s*PEER_STACK_OVERFLOW\s*$' -Quiet) {
            Write-Output 'Diagnostic captured an overflow; this is NOT a passing test or a repair.'
            exit 1
          }
          Write-Output 'No marked overflow stack captured; result is inconclusive. Do not retry or broaden automatically.'
          exit 1
